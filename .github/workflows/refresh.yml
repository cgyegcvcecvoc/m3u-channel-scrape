name: Refresh reviewed M3U playlists

# Scheduled workflows only run once the workflow file exists on the default
# branch. Even then, generated files are written ONLY to this Arena work branch.
on:
  schedule:
    - cron: "17 6 * * *" # daily, UTC; GitHub may delay scheduled starts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-arena-01a0da01-m3u-channel-scrape
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0da01-m3u-channel-scrape
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test without network
        run: python3 -m unittest discover -s tests -v
      - name: Fetch candidate feeds and regenerate reviewed playlists
        run: python3 scripts/update_playlists.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate the newly generated M3U files
        run: python3 -m unittest discover -s tests -v
      - name: Commit changed generated files to work branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          if git diff --cached --quiet; then
            echo "No playlist or EPG-link changes."
            exit 0
          fi
          git commit -m "Refresh reviewed free-viewing playlists"
          git push origin HEAD:refs/heads/arena/01a0da01-m3u-channel-scrape
