name: Verify channel streams

# Probes every catalog channel and the root bulk playlist, writes
# generated/verification.json, and keeps the two *.m3u8 "verified" playlists
# limited to entries that returned a real media segment. Push trigger skips
# the bot's own commits to avoid a loop; schedule activates after this file
# lands on the default branch.
on:
  push:
    branches:
      - arena/01a0db4b-m3u-channel-scrape
  schedule:
    - cron: "43 8 * * *" # daily after the refresh window, UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-arena-01a0db0b-m3u-channel-scrape
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0db4b-m3u-channel-scrape
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe catalog and bulk playlists
        run: python3 scripts/verify_channels.py --workers 24 --timeout 10
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Commit verification results to work branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/verification.json generated/playlists/usa-verified.m3u usa-verified.m3u
          if git diff --cached --quiet; then
            echo "No verification changes."
            exit 0
          fi
          git commit -m "Update live channel verification results"
          git pull --rebase origin arena/01a0db4b-m3u-channel-scrape
          git push origin HEAD:refs/heads/arena/01a0db4b-m3u-channel-scrape
